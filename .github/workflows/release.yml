name: Release

# FILE: .github/workflows/release.yml
# VERSION: 1.0.0
# START_MODULE_CONTRACT
#   PURPOSE: Build, verify, sign, and publish AutoHeat APK assets for tag-based releases.
#   SCOPE: GitHub Actions release automation for v* tags only.
#   DEPENDS: Flutter 3.41.9, Android release keystore secrets, M-PLUGIN
#   LINKS: M-MAIN, M-PLUGIN, V-M-MAIN
#   ROLE: CONFIG
#   MAP_MODE: NONE
# END_MODULE_CONTRACT
#
# START_CHANGE_SUMMARY
#   LAST_CHANGE: [v1.0.0 - require stable Android signing secrets for CI release APKs]
# END_CHANGE_SUMMARY

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pin под текущую локальную версию для воспроизводимости. Бампать
          # вручную одновременно с пересборкой локально.
          flutter-version: '3.41.9'
          cache: true

      - name: Flutter doctor
        run: flutter --version

      - name: Get dependencies
        run: |
          flutter pub get
          (cd packages/android_automotive_plugin && flutter pub get)

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Extract version from tag
        id: ver
        run: |
          # v0.1.0 → VERSION=0.1.0, TAG=v0.1.0
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG"     >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/signing/release.keystore

      - name: Build APK (arm64-v8a)
        env:
          AUTOHEAT_KEYSTORE_PATH: signing/release.keystore
          AUTOHEAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUTOHEAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUTOHEAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: flutter build apk --release --target-platform android-arm64 --build-name "${{ steps.ver.outputs.VERSION }}" --build-number "${{ github.run_number }}"

      - name: Extract changelog section for this version
        id: changelog
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          # Ищем секцию '## [VERSION]' в CHANGELOG.md и берём всё до следующей
          # '## [...]' секции. Если секция не найдена — fallback на простой текст.
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) { exit }
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "Release ${VERSION}" > release_body.md
          fi
          echo "--- release_body.md ---"
          cat release_body.md
          echo "--- end ---"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.TAG }}
          tag_name: ${{ steps.ver.outputs.TAG }}
          body_path: release_body.md
          files: build/app/outputs/apk/release/AutoHeat-v3.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
