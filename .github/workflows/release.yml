name: Release

# FILE: .github/workflows/release.yml
# VERSION: 0.6.0
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and publish GitHub release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract version from tag
        id: ver
        run: |
          # v0.1.0 → VERSION=0.1.0, TAG=v0.1.0
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG"     >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Validate Android signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Decode Android release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/signing
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/signing/release.keystore

      - name: Test, lint, and build release APK
        env:
          AUTOHEAT_KEYSTORE_PATH: signing/release.keystore
          AUTOHEAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          AUTOHEAT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          AUTOHEAT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew test lint assembleRelease

      - name: Extract changelog section for this version
        id: changelog
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          # Ищем секцию '## [VERSION]' в CHANGELOG.md и берём всё до следующей
          # '## [...]' секции. Если секция не найдена — fallback на простой текст.
          awk -v ver="$VERSION" '
            BEGIN { found=0 }
            /^## \[/ {
              if (found) { exit }
              if (index($0, "[" ver "]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            echo "Release ${VERSION}" > release_body.md
          fi
          echo "--- release_body.md ---"
          cat release_body.md
          echo "--- end ---"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.ver.outputs.TAG }}
          tag_name: ${{ steps.ver.outputs.TAG }}
          body_path: release_body.md
          files: app/build/outputs/apk/release/AutoHeat-native-v*.apk
          fail_on_unmatched_files: true
          generate_release_notes: false
