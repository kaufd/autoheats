// FILE: android/app/build.gradle
// VERSION: 1.0.0
// START_MODULE_CONTRACT
//   PURPOSE: Android application build config for AutoHeat APK packaging, SDK bounds, ABI filtering, version metadata, and signing.
//   SCOPE: Gradle android/application settings only; runtime behavior lives under lib/ and packages/.
//   DEPENDS: Flutter Gradle plugin, Android Gradle Plugin, M-PLUGIN
//   LINKS: M-MAIN, M-PLUGIN, V-M-MAIN
//   ROLE: CONFIG
//   MAP_MODE: NONE
// END_MODULE_CONTRACT
//
// START_CHANGE_SUMMARY
//   LAST_CHANGE: [v1.0.0 - release signing can use stable AUTOHEAT_* keystore env vars; local builds fall back to debug signing]
// END_CHANGE_SUMMARY

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def releaseSigning = [
    storeFilePath: System.getenv("AUTOHEAT_KEYSTORE_PATH"),
    storePassword: System.getenv("AUTOHEAT_KEYSTORE_PASSWORD"),
    keyAlias: System.getenv("AUTOHEAT_KEY_ALIAS"),
    keyPassword: System.getenv("AUTOHEAT_KEY_PASSWORD"),
]
def releaseSigningValues = releaseSigning.values()
def hasAnyReleaseSigningEnv = releaseSigningValues.any { it != null && !it.isBlank() }
def hasFullReleaseSigningEnv = releaseSigningValues.every { it != null && !it.isBlank() }

if (hasAnyReleaseSigningEnv && !hasFullReleaseSigningEnv) {
    throw new GradleException("Incomplete release signing env: set AUTOHEAT_KEYSTORE_PATH, AUTOHEAT_KEYSTORE_PASSWORD, AUTOHEAT_KEY_ALIAS, and AUTOHEAT_KEY_PASSWORD.")
}

if (System.getenv("GITHUB_ACTIONS") == "true" && !hasFullReleaseSigningEnv) {
    throw new GradleException("GitHub release builds must use stable signing. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets.")
}

android {
    namespace = "ru.kaufd.autoheat"
    compileSdk = flutter.compileSdkVersion
    // ndkVersion = flutter.ndkVersion
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "ru.kaufd.autoheat"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        // minSdk = flutter.minSdkVersion
        minSdkVersion = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            output.outputFileName = "AutoHeat-v3.apk"
        }
    }

    signingConfigs {
        if (hasFullReleaseSigningEnv) {
            release {
                storeFile = file(releaseSigning.storeFilePath)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            // CI must use a stable release key. Local release builds may keep using
            // debug signing for fast sideload smoke checks.
            signingConfig = hasFullReleaseSigningEnv ? signingConfigs.release : signingConfigs.debug

            ndk {
                abiFilters "arm64-v8a"
            }
        }
        debug {
            ndk {
                abiFilters "arm64-v8a", "x86_64"
            }
        }
    }
}

flutter {
    source = "../.."
}
