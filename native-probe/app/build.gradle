plugins {
    id 'com.android.application'
}

android {
    namespace 'com.wt.airconditioner'
    compileSdk 33

    defaultConfig {
        // Имя обязано совпадать с whitelisted-пакетом головы: с любым другим
        // CarService не отдаёт CarHvacManager (SecurityException "not in white list").
        applicationId "com.wt.airconditioner"
        minSdk 23
        targetSdk 33
        versionCode 241
        versionName "0.5.1-session"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    // Verification gate: lint обязан проходить без ошибок. Исключения по
    // permissions подавлены адресно в манифесте, с объяснением.
    lint {
        abortOnError true
        // Намеренные решения проекта, а не недосмотр:
        //   OldTargetApi/GradleDependency — 33 выбран под legacy AAOS-голову,
        //     ровно как у оригинального com.wt.airconditioner;
        //   HardcodedText — диагностический инструмент на один экран,
        //     ресурсы строк тут только мешают читать разметку.
        disable += ['OldTargetApi', 'GradleDependency', 'HardcodedText']
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "AutoHeatProbe-v${variant.versionName}-vc${variant.versionCode}.apk"
        }
    }
}

dependencies {
    // Стаб системного android.car — тот же jar и тот же способ подключения
    // (implementation, не compileOnly), что у доказанно работающего плагина.
    // На голове классы приходят из BOOTCLASSPATH, стаб в APK не мешает.
    implementation files('libs/android.car.jar')

    testImplementation 'junit:junit:4.13.2'
}
