plugins {
    id 'com.android.application'
}

def releaseSigning = [
    storeFilePath: System.getenv('AUTOHEAT_KEYSTORE_PATH'),
    storePassword: System.getenv('AUTOHEAT_KEYSTORE_PASSWORD'),
    keyAlias: System.getenv('AUTOHEAT_KEY_ALIAS'),
    keyPassword: System.getenv('AUTOHEAT_KEY_PASSWORD'),
]
def hasAnyReleaseSigningEnv = releaseSigning.values().any { it != null && !it.isBlank() }
def hasFullReleaseSigningEnv = releaseSigning.values().every { it != null && !it.isBlank() }

if (hasAnyReleaseSigningEnv && !hasFullReleaseSigningEnv) {
    throw new GradleException('Incomplete release signing env: set AUTOHEAT_KEYSTORE_PATH, AUTOHEAT_KEYSTORE_PASSWORD, AUTOHEAT_KEY_ALIAS, and AUTOHEAT_KEY_PASSWORD.')
}

if (System.getenv('GITHUB_ACTIONS') == 'true' && !hasFullReleaseSigningEnv) {
    throw new GradleException('GitHub release builds must use stable signing. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, and ANDROID_KEY_PASSWORD secrets.')
}

android {
    namespace 'com.wt.airconditioner'
    compileSdk 33

    defaultConfig {
        // Имя обязано совпадать с whitelisted-пакетом головы: с любым другим
        // CarService не отдаёт CarHvacManager (SecurityException "not in white list").
        applicationId "com.wt.airconditioner"
        // Приложение предназначено только для головы Changan на Android 9.
        minSdk 28
        targetSdk 33
        versionCode 2000
        versionName "2.0.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Экран обновления показывает VERSION_NAME/VERSION_CODE и сравнивает
    // опубликованную сборку с установленной.
    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (hasFullReleaseSigningEnv) {
            release {
                storeFile = file(releaseSigning.storeFilePath)
                storePassword = releaseSigning.storePassword
                keyAlias = releaseSigning.keyAlias
                keyPassword = releaseSigning.keyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasFullReleaseSigningEnv ? signingConfigs.release : signingConfigs.debug
        }
    }

    // Verification gate: lint обязан проходить без ошибок. Исключения по
    // permissions подавлены адресно в манифесте, с объяснением.
    lint {
        abortOnError true
        // Намеренные решения проекта, а не недосмотр:
        //   OldTargetApi/GradleDependency — 33 выбран под legacy AAOS-голову,
        //     ровно как у оригинального com.wt.airconditioner;
        //   HardcodedText — диагностический инструмент на один экран,
        //     ресурсы строк тут только мешают читать разметку.
        disable += ['OldTargetApi', 'GradleDependency', 'HardcodedText']
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "AutoHeat-native-v${variant.versionName}-vc${variant.versionCode}.apk"
        }
    }
}

dependencies {
    // Стаб системного android.car — тот же jar и тот же способ подключения
    // (implementation, не compileOnly), что у доказанно работающего плагина.
    // На голове классы приходят из BOOTCLASSPATH, стаб в APK не мешает.
    implementation files('libs/android.car.jar')

    // Листание вкладок пальцем. Именно v1, а не viewpager2: страницы здесь —
    // четыре статических экрана, живущих всё время работы приложения, и
    // PagerAdapter умеет отдавать готовую View как есть. ViewPager2 построен на
    // RecyclerView, и тот же результат потребовал бы отключить рециклинг
    // уникальным viewType на страницу, притащив за собой recyclerview и fragment.
    implementation 'androidx.viewpager:viewpager:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    // Android предоставляет org.json во время работы, JVM-тестам нужна его
    // обычная реализация для проверки разбора ответа GitHub Releases.
    testImplementation 'org.json:json:20240303'
}
